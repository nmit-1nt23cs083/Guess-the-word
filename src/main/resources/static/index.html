<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Word</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">GUESS<span>THE</span>WORD</div>
  <div id="userBadge" class="user-badge hidden">
    <span id="userLabel"></span>
    <button id="logoutBtn" class="link-btn">Log out</button>
  </div>
</header>

<main id="app">

  <!-- ===================== AUTH SCREEN ===================== -->
  <section id="authScreen" class="panel auth-panel">
    <div class="auth-tabs">
      <button class="tab-btn active" data-tab="login">Log in</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label>Username
        <input type="text" id="loginUsername" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary-btn">Log in</button>
      <p class="form-msg" id="loginMsg"></p>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <label>Username
        <input type="text" id="regUsername" required>
      </label>
      <p class="hint">At least 5 letters, must include upper &amp; lower case (e.g. JaneDoe)</p>
      <label>Password
        <input type="password" id="regPassword" required>
      </label>
      <p class="hint">At least 5 characters with a letter, a number, and one of $ % *</p>
      <button type="submit" class="primary-btn">Create account</button>
      <p class="form-msg" id="registerMsg"></p>
    </form>
  </section>

  <!-- ===================== PLAYER GAME SCREEN ===================== -->
  <section id="gameScreen" class="panel game-panel hidden">
    <div class="game-header">
      <h2>Guess the 5-letter word</h2>
      <button id="newGameBtn" class="primary-btn">Start new game</button>
    </div>
    <p class="rules">Up to 3 games a day &middot; 5 guesses per game &middot; letters only, A&ndash;Z</p>

    <div id="board" class="board"></div>

    <form id="guessForm" class="guess-form hidden">
      <input type="text" id="guessInput" maxlength="5" placeholder="ABCDE" autocomplete="off">
      <button type="submit" class="primary-btn">Guess</button>
    </form>
    <p class="form-msg" id="gameMsg"></p>
  </section>

  <!-- ===================== ADMIN REPORT SCREEN ===================== -->
  <section id="adminScreen" class="panel admin-panel hidden">
    <h2>Daily report</h2>
    <form id="reportForm" class="report-form">
      <label>Date
        <input type="date" id="reportDate">
      </label>
      <button type="submit" class="primary-btn">Get report</button>
    </form>
    <div id="reportResult" class="report-result hidden">
      <div class="stat"><span id="statUsers">0</span><label>players today</label></div>
      <div class="stat"><span id="statGames">0</span><label>games played</label></div>
      <div class="stat"><span id="statWins">0</span><label>words guessed correctly</label></div>
    </div>
    <p class="form-msg" id="reportMsg"></p>

    <hr class="divider">

    <h2>User report</h2>
    <form id="userReportForm" class="report-form">
      <label>Username
        <input type="text" id="userReportUsername" required>
      </label>
      <label>Date (optional)
        <input type="date" id="userReportDate">
      </label>
      <button type="submit" class="primary-btn">Get user report</button>
    </form>
    <table id="userReportTable" class="report-table hidden">
      <thead>
        <tr><th>Date</th><th>Words tried</th><th>Correct guesses</th></tr>
      </thead>
      <tbody id="userReportBody"></tbody>
    </table>
    <p class="form-msg" id="userReportMsg"></p>
  </section>

</main>

<!-- Modal for win / lose messages -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-box">
    <p id="modalText"></p>
    <button id="modalOk" class="primary-btn">OK</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
