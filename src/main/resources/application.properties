spring.application.name=wordguess-game
server.port=8080

# H2 file-based database - data survives restarts, stored under ./data
spring.datasource.url=jdbc:h2:file:./data/wordguessdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Handy for inspecting the DB during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
